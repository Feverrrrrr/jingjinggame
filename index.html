<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=960">
<title>深海旅馆：13 楼没有客人</title>
<style>
  :root{
    --bg:#030d15; --deep:#041c2a; --panel:#071d2a; --panel2:#0a2838;
    --line:rgba(198,166,100,.34); --gold:#d9bd7a; --cream:#f4e6c4;
    --ink:#e9fbff; --muted:#88b4c4; --teal:#6fe3c0; --red:#ff7070;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#01070c;overflow:hidden;
    font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center}
  #app{position:relative;width:960px;height:540px;overflow:hidden;
    background:radial-gradient(700px 420px at 24% 10%,#0a3c52 0%,#041722 48%,#02090f 100%)}
  #app:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120px 240px at 15% 0%,rgba(120,230,255,.07),transparent 70%),
      radial-gradient(180px 300px at 80% 0%,rgba(120,230,255,.05),transparent 70%);
  }
  .bubble{position:absolute;border:1px solid rgba(150,235,255,.16);border-radius:50%;
    pointer-events:none;animation:rise linear infinite}
  @keyframes rise{from{transform:translateY(560px)}to{transform:translateY(-80px)}}
  header{position:absolute;left:0;right:0;top:0;height:48px;padding:0 22px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(198,166,100,.16);background:rgba(2,10,16,.62);z-index:2}
  .brand{font-size:13px;letter-spacing:.2em;color:var(--gold)}
  .brand b{color:var(--cream);letter-spacing:.08em}
  .meta{font-size:12px;color:var(--muted);letter-spacing:.08em}
  main{position:absolute;left:0;right:0;top:48px;bottom:0;display:grid;
    grid-template-columns:300px 1fr;gap:18px;padding:18px 22px}
  .elevator{position:relative;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,rgba(8,33,45,.8),rgba(2,11,17,.95));
    padding:18px;display:flex;flex-direction:column;align-items:center}
  .floor-label{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .floor{font-size:34px;font-weight:800;color:var(--cream);letter-spacing:.06em;margin-top:4px}
  .doors{position:relative;width:150px;height:220px;margin:12px 0 10px;border:5px solid #8f703d;
    border-radius:6px;background:#020b11;box-shadow:0 0 0 1px #d9bd7a inset,0 12px 30px rgba(0,0,0,.5)}
  .doors:before,.doors:after{content:"";position:absolute;top:0;bottom:0;width:50%;
    background:linear-gradient(90deg,#0a2b3a,#12475a 55%,#071a25)}
  .doors:before{left:0;border-right:1px solid rgba(0,0,0,.7)}
  .doors:after{right:0;border-left:1px solid rgba(0,0,0,.7)}
  .doors.open:before{transform:translateX(-42px)}
  .doors.open:after{transform:translateX(42px)}
  .doors:before,.doors:after{transition:transform .35s ease}
  .door-seam{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(0,0,0,.6);z-index:2}
  .thirteen{position:relative;left:auto;bottom:auto;transform:none;margin:8px 0 0;
    width:72px;height:30px;border-radius:7px;border:1px solid rgba(198,166,100,.4);
    background:#07141c;color:#6b7d84;font-size:13px;letter-spacing:.1em;
    display:flex;align-items:center;justify-content:center;transition:.2s}
  .thirteen.lit{color:#ff8b8b;border-color:#ff6b6b;background:#2a0d12;
    box-shadow:0 0 18px rgba(255,90,90,.55),0 0 0 1px rgba(255,180,150,.25) inset;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 8px rgba(255,90,90,.25)}}
  .order{margin-top:auto;width:100%}
  .order-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.12em}
  .bar{height:7px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;width:50%;border-radius:6px;
    background:linear-gradient(90deg,#ff6b6b,#ffd166,#6fe3c0);transition:width .3s}
  .panel{position:relative;display:flex;flex-direction:column;min-width:0}
  .rules{border:1px solid rgba(198,166,100,.22);border-radius:12px;background:rgba(4,20,29,.66);
    padding:11px 14px;margin-bottom:12px}
  .rules-title{font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
  .rule{font-size:12px;line-height:1.55;color:#bfe3ec;display:flex;gap:7px}
  .rule i{font-style:normal;color:var(--red);font-weight:700}
  .event{flex:1;border:1px solid rgba(198,166,100,.24);border-radius:14px;
    background:linear-gradient(135deg,rgba(7,31,43,.9),rgba(3,13,20,.92));padding:18px 20px;
    display:flex;flex-direction:column;min-height:0;position:relative;padding-right:296px}
  .guest-art{position:absolute;right:6px;bottom:2px;height:378px;width:auto;pointer-events:none;
    opacity:0;transform:translateY(8px);transition:opacity .32s ease,transform .32s ease;
    filter:drop-shadow(0 0 18px rgba(20,80,96,.45))}
  .guest-art.show{opacity:1;transform:translateY(0)}
  .bgm-btn{margin-left:18px;cursor:pointer;
    border:1px solid rgba(198,166,100,.28);background:rgba(4,20,29,.7);color:var(--gold);
    border-radius:999px;padding:3px 10px;font-size:11px;letter-spacing:.06em;font-family:inherit}
  .bgm-btn:hover{border-color:var(--gold)}
  .bgm-btn.off{color:#6b7d84;border-color:rgba(120,140,150,.3)}
  .event-top{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted);letter-spacing:.1em}
  .chip{border:1px solid rgba(198,166,100,.3);border-radius:999px;padding:4px 10px}
  .chip.danger{color:#ffc1c1;border-color:rgba(255,110,110,.45);background:rgba(70,10,16,.35)}
  .guest{font-size:18px;color:var(--cream);font-weight:700;margin:12px 0 4px}
  .line{font-size:16px;line-height:1.65;color:#e1f7ff;min-height:52px}
  .hint{font-size:11px;color:#7fa8b7;margin-top:8px}
  .choices{display:grid;grid-template-columns:1fr;gap:7px;margin-top:12px}
  .choice{text-align:left;border:1px solid rgba(198,166,100,.25);border-radius:9px;
    background:rgba(8,28,39,.8);color:#dff7ff;padding:10px 12px;font-size:14px;cursor:pointer;
    transition:.15s;font-family:inherit}
  .choice:hover{border-color:var(--gold);background:rgba(22,55,69,.95);transform:translateX(2px)}
  .choice b{color:var(--gold);margin-right:8px;font-size:11px}
  .feedback{margin-top:12px;border-left:2px solid var(--gold);padding:8px 12px;
    background:rgba(2,12,18,.7);font-size:13px;line-height:1.65;color:#d9f6ff}
  .feedback.bad{border-color:var(--red)}
  .feedback.good{border-color:var(--teal)}
  .primary{margin-top:12px;border:1px solid var(--gold);background:linear-gradient(180deg,#e5cb8c,#b58e4a);
    color:#1b1307;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
    align-self:flex-start;font-family:inherit}
  .primary:hover{filter:brightness(1.08)}
  .overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
    background:rgba(1,7,12,.78);backdrop-filter:blur(4px);padding:40px}
  .overlay.show{display:flex}
  .card{width:620px;border:1px solid var(--line);border-radius:16px;background:
    linear-gradient(160deg,rgba(7,28,40,.98),rgba(2,10,16,.99));padding:30px 34px;text-align:left;
    box-shadow:0 20px 70px rgba(0,0,0,.55)}
  .card h1{margin:0;font-size:34px;line-height:1.35;color:#f7e8c2;letter-spacing:.04em}
  .card h2{margin:0 0 10px;font-size:24px;color:#f7e8c2}
  .card p{margin:12px 0;color:#b9dce8;line-height:1.8;font-size:14px}
  .card small{color:#7fa8b7;font-size:11px;letter-spacing:.12em}
  .card .primary{margin-top:18px}
  .kbd{font-size:11px;color:#7fa8b7;margin-top:10px}
  @media(max-width:980px){#app{transform:scale(.86)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">鲸鲸的深海旅馆 · <b>夜班电梯</b></div>
    <div class="meta" id="meta">第 1 夜 · 停靠 1/5</div>
    <button class="bgm-btn" id="bgmBtn" title="背景音乐开关">♪ BGM</button>
  </header>

  <main>
    <section class="elevator">
      <div class="floor-label">当前楼层</div>
      <div class="floor" id="floorDisplay">—</div>
      <div class="doors" id="doors"><div class="door-seam"></div></div>
      <div class="thirteen" id="thirteen">13F</div>
      <div class="order">
        <div class="order-head"><span>旅馆秩序</span><b id="orderNum">50</b></div>
        <div class="bar"><i id="orderBar"></i></div>
      </div>
    </section>

    <section class="panel">
      <div class="rules">
        <div class="rules-title">今夜规则</div>
        <div id="rules"></div>
      </div>
      <div class="event">
        <img class="guest-art" id="guestArt" alt="">
        <div class="event-top">
          <span class="chip" id="floorChip">—</span>
          <span class="chip" id="shadowChip">—</span>
          <span id="guestLabel">电梯停靠中</span>
        </div>
        <div class="guest" id="guest">—</div>
        <div class="line" id="line">—</div>
        <div class="hint" id="hint"></div>
        <div class="choices" id="choices"></div>
        <div id="feedback"></div>
        <button class="primary" id="primary" style="display:none"></button>
      </div>
    </section>
  </main>

  <div class="overlay show" id="overlay">
    <div class="card" id="overlayCard">
      <small>鲸鲸的深海旅馆 · 夜班</small>
      <h1>13 楼<br>没有客人</h1>
      <p>本店没有 13 楼。<br>可今晚，13 楼的按钮自己亮了。</p>
      <p>你是夜班电梯员。看规则，看影子，别让“不是客人”的东西进来。</p>
      <button class="primary" id="startBtn">开始值班</button>
      <div class="kbd">鼠标点击，或按 1 / 2 / 3 选择 · Enter 继续</div>
    </div>
  </div>
</div>
<script src="core.js"></script>
<audio id="bgmNight" src="assets/night.ogg" loop preload="auto" style="display:none"></audio>
<audio id="bgm13" src="assets/floor13.ogg" loop preload="auto" style="display:none"></audio>
<script src="game.js"></script>
</body>
</html>
